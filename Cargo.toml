[package]
name = "labyrinth"
version = "0.1.0"
edition = "2024"
description = "Desktop MOBA / action-RTS foundations powered by Bevy"
license = "MIT"
repository = "https://github.com/ElliotW1999/labyrinth"

[dependencies]
bevy = "0.19"
bincode = "1.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
